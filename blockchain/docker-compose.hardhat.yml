version: "3.9"

services:
  hardhat:
    build:
      context: .
      dockerfile: Dockerfile
    image: hardhat-deployer:latest
    container_name: hardhat-deployer
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # restart not needed for one-off tasks, but useful for long-running node
    restart: unless-stopped
