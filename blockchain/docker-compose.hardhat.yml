services:
  hardhat:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: hardhat-deployer:latest
    container_name: hardhat-deployer
    working_dir: /app
    volumes:
      - .:/app
      - hardhat-compiler-cache:/root/.cache/hardhat-nodejs
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # restart not needed for one-off tasks, but useful for long-running node
    restart: unless-stopped

volumes:
  hardhat-compiler-cache:
