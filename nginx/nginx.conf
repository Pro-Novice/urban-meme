worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;
    more_clear_headers Server;

    # Trust real client IPs from private networks (Docker bridge)
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # Rate limit: 10 requests/sec per IP, burst 20
    limit_req_zone $binary_remote_addr zone=ip_rate_limit:10m rate=10r/s;
    limit_req_status 429;

    upstream django_app {
        server web:8000;
    }

    server {
        listen 80;

        client_max_body_size 20m;


        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /static/ {
            alias /app/static/;
            access_log off;
            expires 30d;
        }

        location /media/ {
            alias /app/media/;
            access_log off;
            expires 30d;
        }

        location / {
            limit_req zone=ip_rate_limit burst=20 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Server;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_pass http://django_app;
        }
    }
}
