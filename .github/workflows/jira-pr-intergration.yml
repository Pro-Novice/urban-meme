name: Jira PR Integration (Clean + Stable DevInfo Link)

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, closed]

jobs:
  jira-update:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Extract Jira Key (RAP project only)
        id: extract
        shell: bash
        run: |
          echo "=== 🧩 Extracting Jira Key ==="
          TITLE="${{ github.event.pull_request.title }}"
          BRANCH="${{ github.head_ref }}"
          KEY=$(echo "$TITLE $BRANCH" | grep -oE 'RAP-[0-9]+' | head -n 1 || true)

          if [ -n "$KEY" ]; then
            echo "✅ Jira key found: $KEY"
            echo "JIRA_KEY=$KEY" >> "$GITHUB_ENV"
          else
            echo "⚠️ No Jira key found in title or branch — skipping."
          fi

      - name: 🌐 Test Jira Connectivity
        shell: bash
        run: |
          echo "=== 🌐 Testing Jira Connectivity ==="
          RESPONSE=$(curl -s -w "%{http_code}" -o serverinfo.json \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/serverInfo")

          echo "HTTP Status: $RESPONSE"
          cat serverinfo.json | jq || cat serverinfo.json
          [ "$RESPONSE" != "200" ] && { echo "❌ Jira connectivity failed."; exit 1; }
          echo "✅ Jira Cloud connectivity verified."

      - name: 🔐 Verify Jira Authentication
        if: env.JIRA_KEY != ''
        shell: bash
        run: |
          echo "=== 🔐 Verifying Jira Authentication ==="
          RESPONSE=$(curl -s -w "%{http_code}" -o jira_me.json \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/myself")
          echo "HTTP Status: $RESPONSE"
          cat jira_me.json | jq || cat jira_me.json
          [ "$RESPONSE" != "200" ] && { echo "❌ Jira authentication failed."; exit 1; }
          echo "✅ Jira authentication successful."

      - name: 💬 Add comment on Jira issue
        if: env.JIRA_KEY != '' && github.event.action != 'closed'
        shell: bash
        run: |
          echo "=== 💬 Adding comment on Jira issue ==="
          COMMENT="🔗 PR [#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }}) - *${{ github.event.pull_request.title }}* by ${{ github.actor }}"
          ADF_JSON=$(jq -nc --arg text "$COMMENT" \
            '{body: {type: "doc", version: 1, content: [{type: "paragraph", content: [{type: "text", text: $text}]}]}}')

          RESPONSE=$(curl -s -w "%{http_code}" -o comment_res.json \
            -X POST -H "Content-Type: application/json" \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            --data "$ADF_JSON" \
            "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/issue/${{ env.JIRA_KEY }}/comment")

          echo "HTTP Status: $RESPONSE"
          cat comment_res.json | jq || cat comment_res.json

      - name: 🔄 Transition Jira issue to 'In Review' (on PR open)
        if: env.JIRA_KEY != '' && github.event.action == 'opened'
        shell: bash
        run: |
          echo "=== 🔄 Transitioning Jira issue ==="
          RESPONSE=$(curl -s -w "%{http_code}" -o transition_res.json \
            -X POST -H "Content-Type: application/json" \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            --data '{"transition": {"id": "31"}}' \
            "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/issue/${{ env.JIRA_KEY }}/transitions")
          echo "HTTP Status: $RESPONSE"
          cat transition_res.json | jq || cat transition_res.json

      - name: 🔗 Link PR to Jira Development Info
        if: env.JIRA_KEY != ''
        shell: bash
        run: |
          echo "=== 🔗 Linking PR to Jira Development Info ==="
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          BRANCH="${{ github.head_ref }}"
          REPO="${{ github.repository }}"
          ISSUE="${{ env.JIRA_KEY }}"
          STATUS="OPEN"
          REPO_URL="https://github.com/$REPO"
          SEQ=$(date +%s)

          # Mark as MERGED/CLOSED when PR closed
          if [ "${{ github.event.action }}" = "closed" ]; then
            if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
              STATUS="MERGED"
            else
              STATUS="DECLINED"
            fi
          fi

          PAYLOAD=$(jq -nc \
            --arg repo "$REPO" \
            --arg repoId "$REPO" \
            --arg repoUrl "$REPO_URL" \
            --arg branch "$BRANCH" \
            --arg name "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg issue "$ISSUE" \
            --arg status "$STATUS" \
            --arg pr_id "${{ github.event.pull_request.number }}" \
            --argjson seq $SEQ \
            '{repositories: [
              {
                id: $repoId,
                name: $repo,
                url: $repoUrl,
                pullRequests: [
                  {
                    id: $pr_id,
                    name: $name,
                    url: $url,
                    issueKeys: [$issue],
                    status: $status,
                    source: {branch: {name: $branch}},
                    destination: {branch: {name: "optimization"}},
                    updateSequenceId: $seq
                  }
                ]
              }
            ]}')

          echo "Payload JSON:"
          echo "$PAYLOAD" | jq

          echo "📤 Sending payload to Jira DevInfo API..."
          RESPONSE=$(curl -s -w "%{http_code}" -o link_res.json \
            -X POST \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://${{ secrets.JIRA_DOMAIN }}/rest/devinfo/0.10/bulk")

          echo "HTTP Status: $RESPONSE"
          cat link_res.json | jq || cat link_res.json
          [ "$RESPONSE" != "202" ] && { echo "❌ DevInfo link failed (HTTP $RESPONSE)"; exit 1; }

          echo "✅ PR successfully linked to Jira issue (DevInfo API accepted)."
