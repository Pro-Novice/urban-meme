name: Jira PR Integration

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, edited]

jobs:
  jira-update:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira Key (RAP project only)
        id: extract
        shell: bash
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          BRANCH="${{ github.head_ref }}"
          KEY=$(echo "$TITLE $BRANCH" | grep -oE 'RAP-[0-9]+' | head -n 1)
          
          if [ -n "$KEY" ]; then
            echo "✅ Detected Jira key: $KEY"
            echo "JIRA_KEY=$KEY" >> "$GITHUB_ENV"
          else
            echo "⚠️ No Jira key detected — skipping."
          fi

      # (Optional) Verify Jira credentials - helps debugging
      - name: Verify Jira Authentication
        if: env.JIRA_KEY != ''
        shell: bash
        run: |
          echo "Verifying Jira credentials for ${{ secrets.JIRA_EMAIL }}..."
          RESPONSE=$(curl -s -w "%{http_code}" -o jira_me.json \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/myself")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Jira authentication successful!"
            jq '.displayName' jira_me.json
          else
            echo "❌ Jira authentication failed (HTTP $RESPONSE)"
            echo "Response:"
            cat jira_me.json
            # Don't fail the job, continue gracefully
          fi

      - name: Add comment on PR open or update
        if: env.JIRA_KEY != '' && github.event.action != 'closed'
        shell: bash
        run: |
          COMMENT="🔗 Pull Request [#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }}) - *${{ github.event.pull_request.title }}* by ${{ github.actor }}"
          echo "Posting ADF comment to Jira issue ${{ env.JIRA_KEY }}..."

          ADF_JSON=$(jq -nc --arg text "$COMMENT" \
            '{body: {type: "doc", version: 1, content: [{type: "paragraph", content: [{type: "text", text: $text}]}]}}')

          curl -X POST \
            -H "Content-Type: application/json" \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            --data "$ADF_JSON" \
            "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/issue/${{ env.JIRA_KEY }}/comment"

      - name: Transition Jira issue to 'In Review' (on PR open)
        if: env.JIRA_KEY != '' && github.event.action == 'opened'
        shell: bash
        run: |
          echo "🚀 Moving ${{ env.JIRA_KEY }} → In Review"
          curl -X POST \
            -H "Content-Type: application/json" \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            --data '{"transition": {"id": "31"}}' \
            "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/issue/${{ env.JIRA_KEY }}/transitions"

      - name: Transition Jira issue to 'Done' (on PR merge)
        if: env.JIRA_KEY != '' && github.event.pull_request.merged == true
        shell: bash
        run: |
          echo "✅ Moving ${{ env.JIRA_KEY }} → Done"
          curl -X POST \
            -H "Content-Type: application/json" \
            -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            --data '{"transition": {"id": "41"}}' \
            "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/issue/${{ env.JIRA_KEY }}/transitions"
