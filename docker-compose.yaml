version: "3.8"

services:
  web:
    image: rajasthan_agri_backend-web:latest
    container_name: rajasthan-agri-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./logs:/app/logs
      - static_volume:/app/static
      - media_volume:/app/media

    depends_on:
      - redis
    env_file:
      - .env.docker
    environment:
      - POSTGRES_HOST=10.70.233.252
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_URL=redis://rajasthan-agri-redis:6379/0
    networks:
      - agri-network

  redis:
    image: redis:alpine
    container_name: rajasthan-agri-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - agri-network

volumes:
  redis_data:
  static_volume:
  media_volume:

networks:
  agri-network:
    driver: bridge
