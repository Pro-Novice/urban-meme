version: "3.8"

services:
  web:
    build: .
    container_name: rajasthan-agri-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    env_file:
      - .env.docker
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - REDIS_URL=${REDIS_URL}
    networks:
      - agri-network

  db:
    image: postgres:14
    container_name: rajasthan-agri-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER} 
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    networks:
      - agri-network

  redis:
    image: redis:alpine
    container_name: rajasthan-agri-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - agri-network

  # Optional service for database management (uncomment if needed)
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: rajasthan-agri-pgadmin
  #   depends_on:
  #     - db
  #   ports:
  #     - "5050:80"
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=admin@example.com
  #     - PGADMIN_DEFAULT_PASSWORD=admin
  #   restart: unless-stopped
  #   networks:
  #     - agri-network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  agri-network:
    driver: bridge